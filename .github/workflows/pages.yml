name: pages

# Publishes the plugins' documentation pages: the landing pages (index.html and uk/index.html) and every
# plugins/*/docs/*.html and plugins/*/docs/uk/*.html, at the paths they have in this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Collect the pages
        run: |
          mkdir -p _site
          cp index.html _site/
          mkdir -p _site/uk
          cp uk/index.html _site/uk/
          for page in plugins/*/docs/*.html plugins/*/docs/uk/*.html; do
            [ -e "$page" ] || continue
            mkdir -p "_site/$(dirname "$page")"
            cp "$page" "_site/$page"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
